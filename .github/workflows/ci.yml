name: ci
on:
  push:
    branches: [ release, alpha, beta, next-major ]
  pull_request:
    branches:
      - '**'
jobs:
  check-lock-file-version:
    name: NPM Lock File Version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check NPM lock file version
        uses: mansona/npm-lockfile-version@v1
        with:
          version: 2
  check-types:
    name: Check Types
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
      - run: npm ci
      - name: Type Definition Check
        run: npm run ci:typecheck
      - name: Test Types
        run: npm run test:types
  check-docs:
    name: Check Docs
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
      - run: npm ci
      - name: Check Docs
        run: npm run docs
  check-circular:
    name: Check Circular Dependencies
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
      - run: npm ci
      - name: Circular Dependencies
        run: npm run madge:circular
  check-lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: Node 20, Parse Server 8
            NODE_VERSION: 20.19.0
            PARSE_SERVER_VERSION: 8
          - name: Node 22, Parse Server 8
            NODE_VERSION: 22.12.0
            PARSE_SERVER_VERSION: 8
          - name: Node 24, Parse Server 8
            NODE_VERSION: 24.1.0
            PARSE_SERVER_VERSION: 8
          - name: Node 20, Parse Server 9
            NODE_VERSION: 20.19.0
            PARSE_SERVER_VERSION: 9
          - name: Node 22, Parse Server 9
            NODE_VERSION: 22.12.0
            PARSE_SERVER_VERSION: 9
          - name: Node 24, Parse Server 9
            NODE_VERSION: 24.1.0
            PARSE_SERVER_VERSION: 9
      fail-fast: false
    name: Build - ${{ matrix.name }}
    steps:
    - name: Fix usage of insecure GitHub protocol
      run: sudo git config --system url."https://github".insteadOf "git://github"
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.NODE_VERSION }}
        cache: npm
    - name: Install Parse Server ${{ matrix.PARSE_SERVER_VERSION }}
      run: npm i -DE parse-server@${{ matrix.PARSE_SERVER_VERSION }}
    - name: Install dependencies
      run: npm ci
    - name: Run unit tests
      run: npm test -- --maxWorkers=4 
    - name: Run integration tests
      run: npm run test:mongodb
      env:
        CI: true
    - name: Upload code coverage
      uses: codecov/codecov-action@v4
      with:
        # Set to `true` once codecov token bug is fixed; https://github.com/parse-community/parse-server/issues/9129
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
